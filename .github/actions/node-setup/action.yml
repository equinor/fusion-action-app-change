name: 'Setup Node and Install Dependencies'
description: 'Setup Node.js and install pnpm dependencies'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        
    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm
        
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile