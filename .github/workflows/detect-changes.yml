name: Fusion App Change Detection

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  
  push:
    branches: [main, develop]
  
  workflow_dispatch:
    inputs:
      base-ref:
        description: 'Base reference to compare against'
        required: false
        default: 'main'
      head-ref:
        description: 'Head reference to check'
        required: false
        default: ''

jobs:
  detect-changes:
    name: Detect Fusion App Changes
    runs-on: ubuntu-latest
    
    outputs:
      changed-apps: ${{ steps.detect.outputs.changed-apps }}
      changed-apps-count: ${{ steps.detect.outputs.changed-apps-count }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      summary: ${{ steps.detect.outputs.summary }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper diff
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Detect changes
        id: detect
        uses: ./  # Use the local action
        with:
          app-paths: 'apps,packages'  # Simple paths to check
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Display results
        run: |
          echo "## 🔍 Fusion App Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary:** ${{ steps.detect.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.detect.outputs.has-changes }}" = "true" ]; then
            echo "### Changed Apps:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**App Types:** ${{ steps.detect.outputs.app-types }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo '${{ steps.detect.outputs.changed-apps }}' | jq '.' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Changed App Names:** ${{ steps.detect.outputs.changed-app-names }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No deployable Fusion apps were changed in this update." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.detect.outputs.has-changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changedApps = JSON.parse('${{ steps.detect.outputs.changed-apps }}');
            const summary = '${{ steps.detect.outputs.summary }}';
            
            let comment = '## 🚀 Fusion App Changes Detected\\n\\n';
            comment += `**${summary}**\\n\\n`;
            
            if (changedApps.length > 0) {
              comment += '### Changed Applications:\\n\\n';
              for (const app of changedApps) {
                comment += `- **${app.name}** (${app.changedFiles.length} files)\\n`;
                comment += `  - Path: \`${app.path}\`\\n`;
                comment += `  - Version: ${app.manifest.version}\\n`;
                if (app.changedFiles.length <= 10) {
                  comment += '  - Changed files:\\n';
                  for (const file of app.changedFiles) {
                    comment += `    - \`${file.path}\` (${file.status})\\n`;
                  }
                } else {
                  comment += `  - Too many files changed (${app.changedFiles.length}), check the full diff\\n`;
                }
                comment += '\\n';
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Example job that runs when changes are detected
  build-changed-apps:
    name: Build Changed Apps
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.changed-apps) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/node-setup
      
      - name: Install dependencies
        run: |
          if [ -f "${{ matrix.app.path }}/package.json" ]; then
            cd ${{ matrix.app.path }}
            if [ -f "pnpm-lock.yaml" ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
          fi
      
      - name: Build app
        run: |
          if [ -f "${{ matrix.app.path }}/package.json" ]; then
            cd ${{ matrix.app.path }}
            if pnpm run | grep -q "build"; then
              pnpm run build
            else
              echo "No build script found, skipping build step"
            fi
          fi
      
      - name: Run tests
        run: |
          if [ -f "${{ matrix.app.path }}/package.json" ]; then
            cd ${{ matrix.app.path }}
            if pnpm run | grep -q "test"; then
              pnpm run test
            else
              echo "No test script found, skipping tests"
            fi
          fi