name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm run test
      
      - name: Check code formatting
        run: |
          npm run format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted properly!"
            echo "Please run 'npm run format' and commit the changes."
            git diff
            exit 1
          fi

  # Test the action itself
  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Test action
        id: test-action
        uses: ./
        with:
          base-ref: HEAD~1
          head-ref: HEAD
          min-changes: 0
      
      - name: Validate outputs
        run: |
          echo "Changed apps count: ${{ steps.test-action.outputs.changed-apps-count }}"
          echo "Has changes: ${{ steps.test-action.outputs.has-changes }}"
          echo "Summary: ${{ steps.test-action.outputs.summary }}"
          
          # Validate JSON outputs
          echo '${{ steps.test-action.outputs.changed-apps }}' | jq .
          echo '${{ steps.test-action.outputs.changed-files }}' | jq .