name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm run test
      
      - name: Check code formatting and style
        run: |
          npm run check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted properly or has linting issues!"
            echo "Please run 'npm run check' and commit the changes."
            git diff
            exit 1
          fi

  # Test the action itself
  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Test action (no Fusion apps expected)
        id: test-action
        uses: ./
        # Don't specify app-paths to test auto-discovery
      
      - name: Validate outputs
        run: |
          echo "Changed apps count: ${{ steps.test-action.outputs.changed-apps-count }}"
          echo "Has changes: ${{ steps.test-action.outputs.has-changes }}"
          echo "Summary: ${{ steps.test-action.outputs.summary }}"
          
          # Validate JSON outputs are valid JSON
          echo '${{ steps.test-action.outputs.changed-apps }}' | jq . > /dev/null
          echo '${{ steps.test-action.outputs.changed-files }}' | jq . > /dev/null
          echo '${{ steps.test-action.outputs.changed-app-paths }}' | jq . > /dev/null
          echo '${{ steps.test-action.outputs.app-types }}' | jq . > /dev/null
          
          # For this repository (no Fusion apps), expect no changes
          if [ "${{ steps.test-action.outputs.has-changes }}" != "false" ]; then
            echo "❌ Expected has-changes to be false for repository with no Fusion apps"
            exit 1
          fi
          
          if [ "${{ steps.test-action.outputs.changed-apps-count }}" != "0" ]; then
            echo "❌ Expected changed-apps-count to be 0 for repository with no Fusion apps"
            exit 1
          fi
          
          echo "✅ Integration test passed - action correctly detected no Fusion apps"