name: Build and Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop] # Only run on develop pushes, main uses ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22, 24]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run linter
        run: pnpm run lint
      
      - name: Run tests
        run: pnpm run test
      
      - name: Check code formatting and style
        run: |
          npm run check
          # Check for uncommitted changes, excluding node_modules
          CHANGED_FILES=$(git status --porcelain | grep -v "node_modules" || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Code is not formatted properly or has linting issues!"
            echo "Please run 'npm run check' and commit the changes."
            echo "Changed files:"
            echo "$CHANGED_FILES"
            git diff --name-only | grep -v node_modules
            exit 1
          fi

  # Test the action itself
  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test action (no Fusion apps expected)
        id: test-action
        uses: ./
        # Don't specify app-paths to test auto-discovery
      
      - name: Validate outputs
        run: |
          echo "=== Action Outputs ==="
          echo "Changed apps count: ${{ steps.test-action.outputs.changed-apps-count }}"
          echo "Has changes: ${{ steps.test-action.outputs.has-changes }}"
          echo "Summary: ${{ steps.test-action.outputs.summary }}"
          echo "Changed apps: ${{ steps.test-action.outputs.changed-apps }}"
          echo "Changed files: ${{ steps.test-action.outputs.changed-files }}"
          echo "Changed app paths: ${{ steps.test-action.outputs.changed-app-paths }}"
          echo "App types: ${{ steps.test-action.outputs.app-types }}"
          
          # Validate JSON outputs are valid JSON (handle empty strings gracefully)
          echo "=== Validating JSON Outputs ==="
          
          CHANGED_APPS='${{ steps.test-action.outputs.changed-apps }}'
          if [ -n "$CHANGED_APPS" ] && [ "$CHANGED_APPS" != "null" ]; then
            echo "$CHANGED_APPS" | jq . > /dev/null || { echo "❌ Invalid changed-apps JSON"; exit 1; }
          fi
          
          CHANGED_FILES='${{ steps.test-action.outputs.changed-files }}'
          if [ -n "$CHANGED_FILES" ] && [ "$CHANGED_FILES" != "null" ]; then
            echo "$CHANGED_FILES" | jq . > /dev/null || { echo "❌ Invalid changed-files JSON"; exit 1; }
          fi
          
          CHANGED_APP_PATHS='${{ steps.test-action.outputs.changed-app-paths }}'
          if [ -n "$CHANGED_APP_PATHS" ] && [ "$CHANGED_APP_PATHS" != "null" ]; then
            echo "$CHANGED_APP_PATHS" | jq . > /dev/null || { echo "❌ Invalid changed-app-paths JSON"; exit 1; }
          fi
          
          APP_TYPES='${{ steps.test-action.outputs.app-types }}'
          if [ -n "$APP_TYPES" ] && [ "$APP_TYPES" != "null" ]; then
            echo "$APP_TYPES" | jq . > /dev/null || { echo "❌ Invalid app-types JSON"; exit 1; }
          fi
          
          echo "✅ All JSON outputs are valid"
          
          # Basic validation - action should complete successfully
          echo "=== Basic Validation ==="
          if [ -z "${{ steps.test-action.outputs.summary }}" ]; then
            echo "❌ Summary output is missing"
            exit 1
          fi
          
          echo "✅ Integration test completed successfully"