name: 'Fusion App Change Detection'
description: 'Detect changes in Fusion applications and publish them accordingly'
author: 'Equinor'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  app-paths:
    description: 'Comma-separated list of paths to directories containing fusion apps (e.g., "apps,packages/apps"). If not specified, will auto-discover.'
    required: false
    default: ''
  
  token:
    description: 'GitHub token for API access'
    required: false
    default: '${{ github.token }}'

outputs:
  changed-apps:
    description: 'JSON array of changed fusion apps with their metadata'
  
  changed-apps-count:
    description: 'Number of changed fusion apps detected'
  
  changed-app-names:
    description: 'Comma-separated list of changed app names'
  
  changed-app-paths:
    description: 'JSON array of changed app root paths'
  
  changed-files:
    description: 'JSON array of all changed files'
  
  has-changes:
    description: 'Whether any changes were detected (true/false)'
  
  summary:
    description: 'Human-readable summary of changes detected'
  
  app-types:
    description: 'JSON array of app names and their types (fusion-cli-app, react-fusion-app, etc.)'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm install -g pnpm
        pnpm install --frozen-lockfile --prod
        
    - name: Run Fusion app change detection
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        node scripts/index.js